apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nats-messaging
  namespace: argocd
spec:
  project: default
  source:
    chart: nats
    repoURL: https://nats-io.github.io/k8s/helm/charts/
    targetRevision: 1.2.x
  destination:
    server: https://kubernetes.default.svc
    namespace: nats-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
