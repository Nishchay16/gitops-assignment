apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nats
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Nishchay16/gitops-assignment.git
    targetRevision: main
    path: overlays/dev/nats 

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true