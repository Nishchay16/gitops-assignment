apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflow-sa
  namespace: app-system
  labels:
    project: assignment
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflow-binding
  namespace: app-system
subjects:
- kind: ServiceAccount
  name: argo-workflow-sa
  namespace: app-system
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
