apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-service
  namespace: app-system
  labels: { project: assignment, app: ui }
spec:
  selector: { matchLabels: { app: ui } }
  template:
    metadata: { labels: { app: ui, project: assignment } }
    spec:
      containers:
      - name: ui
        image: nginx:alpine
        resources: { limits: { cpu: "100m" } }
        env:
        - name: NATS_URL
          value: "nats://nats-messaging.nats-system.svc.cluster.local:4222"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-service
  namespace: app-system
  labels: { project: assignment, app: http }
spec:
  selector: { matchLabels: { app: http } }
  template:
    metadata: { labels: { app: http, project: assignment } }
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo
        args: ["-text", "HTTP API Response"]
        resources: { limits: { cpu: "100m" } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-service
  namespace: app-system
  labels: { project: assignment, app: ws }
spec:
  selector: { matchLabels: { app: ws } }
  template:
    metadata: { labels: { app: ws, project: assignment } }
    spec:
      containers:
      - name: ws
        image: jmalloc/echo-server
        resources: { limits: { cpu: "100m" } }
---
apiVersion: v1
kind: Service
metadata:
  name: ws-service
  namespace: app-system
spec:
  selector: { app: ws }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: app-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - http:
      paths:
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: ws-service
            port: { number: 80 }
