apiVersion: v1
kind: Namespace
metadata:
  name: app-system
  labels:
    project: assignment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-server
  namespace: app-system
  labels:
    project: assignment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-server
  template:
    metadata:
      labels:
        app: http-server
        project: assignment
    spec:
      containers:
      - name: server
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-process
  namespace: app-system
  labels:
    project: assignment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        project: assignment
    spec:
      containers:
      - name: worker
        image: busybox
        command: ["sh", "-c", "while true; do echo 'Processing...'; sleep 10; done"]
