apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-code
data:
  worker.py: |
    import asyncio
    from nats.aio.client import Client as NATS

    async def run():
        nc = NATS()
        await nc.connect("nats://nats:4222")

        async def handler(msg):
            print("Received:", msg.data.decode())

        await nc.subscribe("jobs", cb=handler)

        while True:
            await asyncio.sleep(1)

    asyncio.run(run())