apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: python:3.11
        command: ["sh", "-c"]
        args:
          - cd /app && pip install nats-py && python worker.py
        volumeMounts:
        - name: worker-code
          mountPath: /app
      volumes:
      - name: worker-code
        configMap:
          name: worker-code