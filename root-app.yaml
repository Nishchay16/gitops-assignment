apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: assignment-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nishchay16/gitops-assignment.git
    targetRevision: HEAD
    path: base
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
